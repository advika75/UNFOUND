<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Niche Fashion Discovery</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background: #f6f4ef;
        color: #1f2523;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .app-shell {
        padding: 24px;
      }

      .mega-menu {
        display: flex;
        align-items: stretch;
        gap: 12px;
        overflow-x: auto;
        padding: 12px;
        border: 1px solid #d9d2c4;
        background: #fffdf8;
      }

      .menu-group {
        min-width: 220px;
        padding: 8px 12px;
        border-left: 1px solid #e5ded1;
      }

      .menu-group h2,
      .menu-column span {
        margin: 0 0 8px;
        color: #66736d;
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .menu-columns {
        display: flex;
        gap: 12px;
      }

      .menu-column {
        display: grid;
        gap: 6px;
        min-width: 96px;
      }

      .category-button,
      .reset-button {
        min-height: 36px;
        border: 1px solid #d6cdc0;
        border-radius: 6px;
        background: #ffffff;
        color: #26302d;
        padding: 0 12px;
        font-size: 0.9rem;
        font-weight: 700;
      }

      .category-button.active,
      .reset-button.active {
        border-color: #19352d;
        background: #19352d;
        color: #ffffff;
      }

      .search-panel {
        display: grid;
        gap: 18px;
        max-width: 1120px;
        margin: 42px auto 28px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #6f5446;
        font-size: 0.82rem;
        font-weight: 800;
        text-transform: uppercase;
      }

      h1 {
        max-width: 820px;
        margin: 0;
        font-size: clamp(2rem, 5vw, 4.6rem);
        line-height: 1;
        letter-spacing: 0;
      }

      .search-form {
        display: grid;
        grid-template-columns: 1fr 52px auto;
        gap: 10px;
      }

      .search-form input[type="search"] {
        min-width: 0;
        height: 52px;
        border: 1px solid #cfc6b8;
        border-radius: 6px;
        padding: 0 16px;
        background: #fffdf8;
        color: #1f2523;
      }

      .icon-button,
      .search-button {
        height: 52px;
        border: 0;
        border-radius: 6px;
        background: #19352d;
        color: #ffffff;
        font-weight: 800;
      }

      .icon-button {
        display: grid;
        place-items: center;
        width: 52px;
      }

      .camera-icon {
        width: 22px;
        height: 22px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .search-button {
        padding: 0 22px;
      }

      .status-line {
        min-height: 24px;
        margin: 0;
        color: #66736d;
        font-weight: 600;
      }

      .results-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 18px;
        max-width: 1180px;
        margin: 0 auto 64px;
      }

      .product-card {
        display: grid;
        overflow: hidden;
        border: 1px solid #ddd4c7;
        border-radius: 8px;
        background: #fffdf8;
      }

      .product-card img,
      .image-placeholder {
        width: 100%;
        aspect-ratio: 4 / 5;
        object-fit: cover;
        background: #e8e0d4;
      }

      .product-body {
        display: grid;
        gap: 10px;
        padding: 14px;
      }

      .product-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        color: #6f5446;
        font-size: 0.82rem;
        font-weight: 800;
        text-transform: uppercase;
      }

      .product-card h2 {
        margin: 0;
        font-size: 1.05rem;
      }

      .product-card p {
        min-height: 44px;
        margin: 0;
        color: #5f6965;
        font-size: 0.92rem;
        line-height: 1.45;
      }

      @media (max-width: 720px) {
        .app-shell {
          padding: 14px;
        }

        .search-form {
          grid-template-columns: 1fr 52px;
        }

        .search-button {
          grid-column: 1 / -1;
        }
      }
    </style>
    <script defer src="./script.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <nav id="megaMenu" class="mega-menu" aria-label="Product categories"></nav>

      <main>
        <section class="search-panel">
          <div>
            <p class="eyebrow">AI Fashion Discovery</p>
            <h1>Search fashion by text or image and discover similar products.</h1>
          </div>
          <form id="searchForm" class="search-form">
            <input id="textQuery" type="search" placeholder="Search linen dresses, silver jewelry, canvas totes..." />
            <button id="cameraButton" class="icon-button" type="button" aria-label="Upload look image">
              <svg class="camera-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 4.5 7.8 6H5.5A2.5 2.5 0 0 0 3 8.5v8A2.5 2.5 0 0 0 5.5 19h13a2.5 2.5 0 0 0 2.5-2.5v-8A2.5 2.5 0 0 0 18.5 6h-2.3L15 4.5H9Z"></path>
                <path d="M12 15.8a3.4 3.4 0 1 0 0-6.8 3.4 3.4 0 0 0 0 6.8Z"></path>
              </svg>
            </button>
            <input id="imageInput" type="file" accept="image/png,image/jpeg" hidden />
            <button class="search-button" type="submit">Search</button>
          </form>
          <p id="statusLine" class="status-line">Search a look, upload a reference, or choose a category.</p>
        </section>

        <section id="resultsGrid" class="results-grid" aria-live="polite"></section>
      </main>
    </div>
  </body>
</html>
