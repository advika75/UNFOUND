# Scoped to the newest, cleanly-typed packages. The wider backend has ~70 pre-existing
# type errors (mostly in app.py); follow_imports=silent keeps those from failing this job.
# Widen `files` as older modules are cleaned up.
[mypy]
files = backend/eval, backend/search, backend/ml
ignore_missing_imports = True
follow_imports = silent
python_version = 3.12
